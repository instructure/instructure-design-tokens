name: Release

on:
  workflow_dispatch:
    inputs:
      major:
        description: 'Bump major version (x.0.0) instead of minor'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Compute next tag
        id: next
        env:
          BUMP_MAJOR: ${{ inputs.major }}
        run: |
          if existing=$(git describe --tags --exact-match HEAD 2>/dev/null); then
            echo "::error::HEAD is already released as ${existing}; refusing to tag an already-tagged commit"
            exit 1
          fi
          latest=$(git describe --tags --abbrev=0)
          ver=${latest#v}
          IFS=. read -r major minor _ <<< "$ver"
          if [ "$BUMP_MAJOR" = "true" ]; then
            new="v$((major + 1)).0.0"
          else
            new="v${major}.$((minor + 1)).0"
          fi
          echo "Latest tag: ${latest} -> new tag: ${new}"
          echo "tag=$new" >> "$GITHUB_OUTPUT"

      - name: Tag and push
        run: |
          git tag "${{ steps.next.outputs.tag }}"
          git push origin "${{ steps.next.outputs.tag }}"
